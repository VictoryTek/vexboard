name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  backend:
    name: Backend (build · lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v3"
          cache-targets: "false"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build backend (release)
        run: cargo build --release --bin vexboard-server

      - name: Generate OpenAPI spec
        env:
          VEXBOARD_DATABASE__PATH: /tmp/vexboard-ci.db
          VEXBOARD_AUTH__SECRET: ci-only-not-a-real-secret
          VEXBOARD_DISCOVERY__ENABLED: "false"
          VEXBOARD_DOCKER__ENABLED: "false"
          VEXBOARD_SERVER__PORT: "17280"
        run: |
          ./target/release/vexboard-server &
          SERVER_PID=$!
          # Wait for the server to be ready
          for i in $(seq 1 10); do
            curl -sf http://localhost:17280/health && break
            sleep 1
          done
          curl -sf http://localhost:17280/api-docs/openapi.json -o openapi.json
          kill $SERVER_PID

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-${{ github.sha }}
          path: openapi.json
          retention-days: 90

  frontend:
    name: Frontend (WASM build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry, build & tools
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v3"
          key: wasm
          cache-targets: "false"

      - name: Install Trunk
        run: which trunk || cargo install trunk --locked

      - name: Build frontend (release)
        working-directory: crates/vexboard-frontend
        run: trunk build --release

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit --ignore RUSTSEC-2023-0071

  publish:
    name: Publish Docker image to GHCR
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/victorytek/vexboard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
