[server]
host = "0.0.0.0"
port = 7280
# Path to static frontend assets (set to "embedded" to use bundled assets)
assets_path = "embedded"
# CORS allowed origins. Use ["*"] to allow any origin (default, suitable for
# local-network deployments). In production, restrict to your frontend URL:
#   allowed_origins = ["https://dashboard.example.com"]
allowed_origins = ["*"]
# Base URL for the selfhst/icons CDN used by the icon picker.
# Override with your own selfhst/icons Docker instance URL for air-gapped deployments.
# icon_cdn_base = "https://cdn.jsdelivr.net/gh/selfhst/icons@main"

[database]
path = "/var/lib/vexboard/vexboard.db"

[auth]
# Session secret — override with VEXBOARD_AUTH__SECRET env var in production
secret = "change-me-in-production"
session_ttl_hours = 168  # 7 days
# Set to true if the server is behind TLS; enables the Secure cookie flag.
# Keep false for plain-HTTP local-network deployments.
secure_cookies = false
# Login rate limiting: max attempts per IP within the window before 429 is returned.
# Set login_rate_limit_attempts to 0 to disable.
login_rate_limit_attempts = 10
login_rate_limit_window_secs = 60
# Authentication mode:
#   "session" (default) — login required; safe for any network exposure.
#   "none" — all API routes open, no login required. Only safe when the
#     network layer itself restricts access (e.g. Tailscale-only, isolated
#     LAN with no untrusted devices). To re-enable login, set this back to
#     "session" (or delete the line / unset VEXBOARD_AUTH__MODE) and
#     restart the server — existing user accounts are untouched by mode
#     changes in either direction, so no re-setup is needed.
mode = "session"

[discovery]
enabled = true
interval_secs = 60
# When true, only show services with sub_state="running" (drops one-shot boot services).
# Pair this with exclude_units to filter out OS-managed daemons.
server_services_only = true
# systemd units to always exclude from discovery.
# Patterns support a single '*' wildcard.
exclude_units = [
  # systemd infrastructure
  "systemd-*.service",
  "user@*.service",
  "getty@*.service",
  "dbus.service",
  # networking OS services
  "NetworkManager.service",
  "NetworkManager-wait-online.service",
  "NetworkManager-dispatcher.service",
  "wpa_supplicant.service",
  "ModemManager.service",
  "firewall.service",
  "nftables.service",
  "iptables.service",
  # printing
  "cups.service",
  "cups-browsed.service",
  # DNS / mDNS / name resolution
  "avahi-daemon.service",
  "nscd.service",
  # Bluetooth & audio
  "bluetooth.service",
  "rtkit-daemon.service",
  # display & session
  "display-manager.service",
  "colord.service",
  # boot / init helpers
  "plymouth-*.service",
  "kmod-static-nodes.service",
  # security & auth
  "polkit.service",
  "apparmor.service",
  "accounts-daemon.service",
  # hardware management
  "udisks2.service",
  "upower.service",
  "acpid.service",
  "power-profiles-daemon.service",
  "bolt.service",
  # virtualisation infrastructure
  "libvirtd.service",
  "libvirt-guests.service",
  # NFS / RPC
  "rpcbind.service",
  "rpc-statd-notify.service",
  # Flatpak
  "flatpak-*.service",
  # NixOS-specific
  "nix-daemon.service",
  "cpufreq.service",
  "scx.service",
  # misc OS daemons
  "samba-wsdd.service",
  "logrotate-checkconf.service",
]

[docker]
enabled = true
interval_secs = 60
# Unix sockets tried in order — missing sockets are silently skipped
sockets = [
  "/var/run/docker.sock",
  "/run/podman/podman.sock",
]
exclude_images = []

[probe]
default_interval_secs = 30
timeout_secs = 5
max_history = 100  # probe_results rows per service to retain

[metrics]
push_interval_ms = 2000  # SSE push frequency

[notifications]
# HMAC-SHA256 signing secret applied to all webhooks (leave empty to skip signing).
# Override per-webhook with a local `secret` field.
webhook_secret = ""
# Retry settings for failed webhook deliveries.
retry_count = 2
retry_delay_secs = 2
# Define webhook endpoints below. Webhooks fire only on service state transitions
# (up→down, down→up). The first probe result after startup is silently recorded
# to avoid an alert flood at boot.
#
# [[notifications.webhooks]]
# url = "https://hooks.example.com/vexboard"
# events = ["service.down", "service.up"]  # omit to receive all events
# secret = ""  # per-webhook HMAC secret override
