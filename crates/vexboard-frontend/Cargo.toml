[package]
name = "vexboard-frontend"
version.workspace = true
edition = "2021"
description = "VexBoard — frontend (Leptos WASM)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "HtmlInputElement", "HtmlElement", "CssStyleDeclaration", "Window", "Storage", "Location", "DragEvent"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
