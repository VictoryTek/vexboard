<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VexBoard</title>
    <link rel="icon" href="/vexboard-logo.png" type="image/png" />
    <link data-trunk rel="copy-file" href="public/vexboard-logo.png" />
    <link data-trunk rel="copy-file" href="public/icons-index.json" />
    <link data-trunk rel="css" href="style/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var t = localStorage.getItem('vexboard-theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      })();
    </script>
</head>
<body class="bg-bg-primary text-text-primary font-geist antialiased">
    <div id="initial-loader" style="position:fixed; inset:0; display:flex; flex-direction:column;
                align-items:center; justify-content:center; gap:0.75rem;
                background-color:var(--color-bg-primary); color:var(--color-text-secondary);
                font-family:'Geist', system-ui, -apple-system, sans-serif;">
        <div style="width:28px; height:28px; border-radius:50%;
                    border:3px solid var(--color-border); border-top-color:var(--color-accent);
                    animation:initial-loader-spin 0.8s linear infinite;"></div>
        <span style="font-size:0.875rem;">Loading VexBoard…</span>
        <span id="initial-loader-slow" style="display:none; font-size:0.75rem; max-width:20rem;
                    text-align:center; color:var(--color-text-muted);">
            This is taking longer than expected. Check your connection to the server.
        </span>
    </div>
    <style>
        @keyframes initial-loader-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        setTimeout(function() {
            var slow = document.getElementById('initial-loader-slow');
            if (slow) { slow.style.display = 'block'; }
        }, 8000);
    </script>
    <link data-trunk rel="rust" data-wasm-opt="z" />
</body>
</html>
