# Local development overrides — merged automatically by `docker compose up`.
# Builds from source instead of pulling ghcr.io/victorytek/vexboard:latest,
# enables debug logging, and stores data in ./dev-data/ for easy inspection.
#
# Usage:
#   docker compose up --build        # build + start
#   docker compose up --build -d     # detached
#   docker compose logs -f vexboard  # follow logs
#   rm -rf dev-data/                 # wipe local database

services:
  vexboard:
    image: vexboard-local
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./dev-data:/var/lib/vexboard
    environment:
      RUST_LOG: "vexboard_server=debug,tower_http=debug,info"
      VEXBOARD_AUTH__SECRET: "dev-only-change-for-production"
